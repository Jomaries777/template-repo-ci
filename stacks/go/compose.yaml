services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      # The distroless image has no shell or curl: the binary checks itself.
      test: ["CMD", "/app", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
