services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
