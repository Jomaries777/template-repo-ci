# `@claude` mentions in issues, PR comments and PR reviews (spec §4.4).
#
# Runs only for the repo OWNER: on a public repo anyone can comment, and every
# run spends the owner's Claude Pro limit. Sonnet by default; a comment that
# contains `@claude opus` selects Opus for hard problems.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review'
        && github.event.review.author_association == 'OWNER'
        && contains(github.event.review.body, '@claude')
      ) || (
        github.event_name == 'issues'
        && github.event.issue.author_association == 'OWNER'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access so Claude can push a branch and open a PR when asked.
    # GITHUB_TOKEN never has the `workflows` permission, so it cannot change CI.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Only one of these is set for any given event.
      REQUEST: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
    steps:
      - name: Choose the model
        id: model
        run: |
          if [[ "$REQUEST" == *"@claude opus"* ]]; then
            echo "model=claude-opus-5-5" >>"$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5-5" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          # Off on purpose: this repo is public and tool output could expose data.
          show_full_output: false
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --max-turns 30
