# M0 Spike B (throwaway): prove claude-code-action runs on the owner's Claude Pro token.
name: spike-claude
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            M0 Spike B smoke test. Run exactly this one command and nothing else:
            gh pr comment ${{ github.event.pull_request.number }} --body "Spike B: Claude Pro token works in CI."
          claude_args: "--max-turns 3 --model claude-sonnet-5-5 --allowedTools 'Bash(gh pr comment:*)'"
