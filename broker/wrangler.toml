# Bot token broker (spec 0002). Deployed by hand by the owner (C6); see
# README.md. The App key is a secret (`wrangler secret put APP_KEY_PKCS8`),
# never in this file.
name = "agent-bot-broker"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
OWNER_LOGIN = "Jomaries777"
OWNER_ID = "322333432"
APP_ID = "5766032"
# The login-only App (jomaries777-agent-login). Its client secret is a Worker
# secret (LOGIN_CLIENT_SECRET): the broker uses it to check that a token was
# issued by this App, so no other token of the owner's is accepted.
LOGIN_CLIENT_ID = "Iv23liFOZk5YaGC6CJc9"
# Kill switch: set to "false" and redeploy to refuse every request.
BROKER_ENABLED = "true"

[[d1_databases]]
binding = "AUDIT"
database_name = "agent-bot-audit"
# Replace with the id printed by `wrangler d1 create agent-bot-audit`.
database_id = "SET_AT_SETUP"
